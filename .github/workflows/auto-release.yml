name: Auto Release Trigger
run-name: "Auto Release · ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
    paths:
      - "micboard/**"
      - "LICENSE"
      - "MANIFEST.in"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  # Coalesce push checks; a newer push cancels an older check that has not
  # yet dispatched preparation. Dispatched preparation retains its own
  # non-cancellable serialization in prepare-release.yml.
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
jobs:
  auto-release:
    name: Check and trigger release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for conventional commits in this push
        id: check
        env:
          # github.event.before is the previous commit on main; for the first
          # push to a fresh main it is all-zeros, which git treats as the
          # root commit when used as a revision range.
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # Light-weight tags created by tooling other than the release workflow
          # are not a release boundary. The authoritative range is the push that
          # just reached main, not "since the last tag".
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$AFTER_SHA"
          else
            RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          fi

          # Match Conventional Commits subjects with optional scope and the
          # breaking-change marker (!). --format=%s yields only the subject so
          # the regex anchors at line start.
          if git log "$RANGE" --format=%s | grep -qE '^(feat|fix)(\([^)]*\))?!?:'; then
            echo "Significant changes (feat/fix) in $RANGE."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No significant changes in $RANGE."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger release workflow
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run prepare-release.yml --ref main
