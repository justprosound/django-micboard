name: Auto Release Trigger
run-name: "Auto Release · ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
    paths:
      - "micboard/**"

permissions: {}

jobs:
  check-commits:
    name: Check for releasable commits
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for conventional commits
        id: check
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tags found. First release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "$LAST_TAG..HEAD" --oneline)
          if echo "$COMMITS" | grep -qE '^(feat|fix):'; then
            echo "Significant changes (feat/fix) detected since $LAST_TAG."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No significant changes since $LAST_TAG."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch-release:
    name: Trigger release workflow
    needs: check-commits
    if: needs.check-commits.outputs.should_release == 'true'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run prepare-release.yml --ref main
