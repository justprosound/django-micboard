---
name: Prepare Release PR
run-name: "Prepare release · ${{ inputs.version || 'automatic CalVer' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer override (YY.MM.DD[.N]); blank uses the next UTC daily release"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          enable-cache: "false"

      - name: Install locked release preparation tools
        run: uv sync --locked --only-group release-preparation

      - name: Validate version format
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            uv run --locked --no-sync bump-my-version bump release \
              --new-version "$REQUESTED_VERSION"
          else
            uv run --locked --no-sync bump-my-version bump release
          fi
          RELEASE_VERSION="$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)"

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}(\.[1-9][0-9]*)?$ ]]; then
            echo "Invalid CalVer format: $RELEASE_VERSION"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "Release v$RELEASE_VERSION already exists"
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "### Preparing release v$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog
        id: changelog
        run: |
          DELIMITER="release-changelog-$(git rev-parse HEAD)"
          awk '
            /^## \[Unreleased\]/ { in_unreleased = 1; next }
            in_unreleased && /^## \[/ { exit }
            in_unreleased { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/unreleased-changelog.md"

          {
            echo "content<<$DELIMITER"
            if grep -q '[^[:space:]]' "$RUNNER_TEMP/unreleased-changelog.md"; then
              cat "$RUNNER_TEMP/unreleased-changelog.md"
            else
              LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
              if [ -n "$LATEST_TAG" ]; then
                git log "$LATEST_TAG"..HEAD --pretty=format:"- %s (%h)"
              else
                git log HEAD --pretty=format:"- %s (%h)"
              fi
            fi
            echo
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  open-release-pr:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.release-pr.outputs.branch }}
      number: ${{ steps.release-pr.outputs.number }}
      sha: ${{ steps.release-pr.outputs.sha }}
      url: ${{ steps.release-pr.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          enable-cache: "false"

      - name: Install locked release preparation tools
        run: uv sync --locked --only-group release-preparation

      - name: Verify the release base is still current
        env:
          RELEASE_BRANCH: release/v${{ needs.prepare-release.outputs.version }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main changed after this release workflow started; dispatch a new release"
            exit 1
          fi

      - name: Update release metadata
        env:
          RELEASE_CHANGELOG: ${{ needs.prepare-release.outputs.changelog }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          uv run --locked --no-sync bump-my-version bump release \
            --new-version "$RELEASE_VERSION"
          if ! grep -q "^## \[$RELEASE_VERSION\]" CHANGELOG.md; then
            printf '%s\n' "$RELEASE_CHANGELOG" > "$RUNNER_TEMP/release-changelog.md"
            uv run --no-project python scripts/promote_changelog.py \
              --version "$RELEASE_VERSION" \
              --date "$(date -u +%Y-%m-%d)" \
              --notes-file "$RUNNER_TEMP/release-changelog.md" \
              CHANGELOG.md
          fi
          uv lock

      - name: Verify modified files
        run: |
          UNEXPECTED=()
          while IFS= read -r -d '' entry; do
            path="${entry:3}"
            case "$path" in
              CHANGELOG.md|pyproject.toml|uv.lock) ;;
              *) UNEXPECTED+=("$path") ;;
            esac
          done < <(git status --porcelain=v1 -z --untracked-files=all)
          if [ "${#UNEXPECTED[@]}" -ne 0 ]; then
            echo "Unexpected files changed during release preparation:"
            printf '  %s\n' "${UNEXPECTED[@]}"
            exit 1
          fi
          if git diff --quiet; then
            echo "Release metadata did not change"
            exit 1
          fi
          git diff --check
          git diff

      - name: Open release pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ github.token }}
          branch: release/v${{ needs.prepare-release.outputs.version }}
          title: "chore: release ${{ needs.prepare-release.outputs.version }}"
          body: "Prepare release ${{ needs.prepare-release.outputs.version }} through the protected main branch."
          commit-message: "chore: bump version to ${{ needs.prepare-release.outputs.version }}"
          sign-commits: true
          add-paths: |
            CHANGELOG.md
            pyproject.toml
            uv.lock

      - name: Set release PR outputs
        id: release-pr
        run: |
          if [ -z "${{ steps.cpr.outputs.pull-request-number }}" ]; then
            echo "Pull request was not created."
            exit 1
          fi
          if [ -z "${{ steps.cpr.outputs.pull-request-head-sha }}" ]; then
            echo "GitHub did not return the pull request head SHA"
            exit 1
          fi
          echo "branch=release/v${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "number=${{ steps.cpr.outputs.pull-request-number }}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ steps.cpr.outputs.pull-request-head-sha }}" >> "$GITHUB_OUTPUT"
          echo "url=${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_OUTPUT"

  validate-release-pr:
    needs: open-release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: write

    steps:
      - name: Dispatch and observe required checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.open-release-pr.outputs.branch }}
          RELEASE_SHA: ${{ needs.open-release-pr.outputs.sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release pull request returned an invalid head commit: $RELEASE_SHA"
            exit 1
          fi

          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in {1..5}; do
            if gh workflow run ci.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$RELEASE_BRANCH"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to dispatch CI after $attempt attempts"
              exit 1
            fi
            echo "Retrying CI dispatch after GitHub API failure (attempt $attempt/5)"
            sleep $((attempt * 5))
          done

          find_dispatched_run() {
            local workflow="$1"
            local run_id
            for attempt in {1..30}; do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$RELEASE_BRANCH" \
                --event workflow_dispatch \
                --limit 20 \
                --json createdAt,databaseId,headSha \
                --jq ".[] | select(.headSha == \"$RELEASE_SHA\" and .createdAt >= \"$DISPATCHED_AT\") | .databaseId" \
                | head -n 1)"
              if [[ "$run_id" =~ ^[0-9]+$ ]]; then
                echo "$run_id"
                return 0
              fi
              echo "Waiting for $workflow dispatch (attempt $attempt/30)" >&2
              sleep 2
            done
            echo "Unable to identify dispatched $workflow run for $RELEASE_SHA" >&2
            return 1
          }

          CI_RUN_ID="$(find_dispatched_run ci.yml)"
          gh run watch "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

  merge-release-pr:
    needs: [prepare-release, open-release-pr, validate-release-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    outputs:
      sha: ${{ steps.release-merge.outputs.sha }}

    steps:
      - name: Enable protected merge after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.open-release-pr.outputs.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --delete-branch \
            --squash

      - name: Wait for the protected pull request to merge
        id: release-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.open-release-pr.outputs.number }}
        run: |
          for attempt in {1..120}; do
            PR_STATE="$(gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json mergedAt,state \
              --jq 'if .mergedAt then "merged" else (.state | ascii_downcase) end')"
            if [ "$PR_STATE" = "merged" ]; then
              MERGE_SHA="$(gh pr view "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json mergeCommit \
                --jq '.mergeCommit.oid')"
              if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Release pull request returned an invalid merge commit: $MERGE_SHA"
                exit 1
              fi
              echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$PR_STATE" = "closed" ]; then
              echo "Release pull request closed without merging"
              exit 1
            fi
            echo "Waiting for protected release pull request checks (attempt $attempt/120)"
            sleep 15
          done
          echo "Timed out waiting for the protected release pull request to merge"
          exit 1

  dispatch-publication:
    needs: [prepare-release, merge-release-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write

    steps:
      - name: Publish the merged release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.merge-release-pr.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          gh workflow run publish-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field expected_sha="$MERGE_SHA" \
            --field version="$RELEASE_VERSION"
          {
            echo "### Final publication approval"
            echo
            echo "The release is built, attested, published to TestPyPI, and verified automatically."
            echo "Approve the pypi-release environment to publish these exact artifacts to PyPI."
            echo "The GitHub release and immutable v$RELEASE_VERSION tag are created afterward."
          } >> "$GITHUB_STEP_SUMMARY"
