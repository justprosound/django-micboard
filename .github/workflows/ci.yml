---
name: CI Quality Gates
run-name: "CI · ${{ github.head_ref || github.ref_name }}"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The test matrix installs Django at `~=X.0`, so it resolves the newest patch release
  # rather than a pinned one. A weekly run is the only thing that catches an upstream
  # Django patch breaking this library between merges.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run prek
        run: uv run --no-sync prek run --all-files --show-diff-on-failure

      - name: Type check with mypy
        run: uv run --no-sync python -m mypy micboard

      - name: Check migration drift
        run: >-
          uv run --no-sync python manage.py makemigrations
          --check --dry-run --settings=tests.settings

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          enable-cache: "false"

      - name: Build wheel
        run: |
          uv build --no-sources --sdist --clear
          uv build --no-sources --wheel dist/*.tar.gz

      - name: Validate reusable-app contents
        run: uv run --no-project python scripts/validate_wheel.py dist/*.whl

      - name: Smoke-test installed wheel
        run: uv run --no-project --with dist/*.whl python scripts/smoke_test_installed_wheel.py

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"  # renovate: datasource=endoflife-date depName=python
          - "3.14"  # renovate: datasource=endoflife-date depName=python
        django-version:
          - "5.2"  # Supported Django LTS floor
          - "6.0"  # renovate: datasource=endoflife-date depName=django
          - "6.1"  # Latest stable
        include:
          # One leg measures and enforces coverage; the rest only prove the suite passes.
          # This was measured, not assumed: Python 3.13 and 3.14 against Django 5.2 and 6.1
          # each reported 98.3097% over the same 296 files with an identical set of missed
          # lines, because `micboard/` contains no `django.VERSION` or `sys.version_info`
          # branch and `tests/` contains no version-gated skip. The premise therefore holds
          # only while that stays true: adding a version-conditional branch means coverage
          # can diverge per leg, and this `include` has to grow to cover the new corner.
          # Keep this combination inside the matrix above.
          - python-version: "3.13"
            django-version: "6.1"
            coverage: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        if: ${{ !matrix.coverage }}
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: uv run --no-sync --with "Django~=${DJANGO_VERSION}.0" pytest tests/ -n auto -v

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: |
          uv run --no-sync --with "Django~=${DJANGO_VERSION}.0" pytest tests/ \
            -n auto \
            --cov=micboard \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=95 \
            --junitxml=junit.xml \
            -v
          uv run --no-sync python scripts/check_coverage_inventory.py

      - name: Archive the coverage report
        if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          # Keep 30 days on main for post-release review; 7 days is enough for PR iteration
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

      # Codecov is a reporting surface, not a gate: `codecov/patch` reports its own status
      # and is not a required context, so an outage there must not fail this workflow.
      - name: Upload the coverage report to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ matrix.coverage && !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          # uv audit and bandit scan source only; no dep install needed
          enable-cache: "false"

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Run Bandit security check
        # bandit scans source AST — no package install required
        run: uvx bandit -r micboard -ll

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: none

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: "/language:python"

  build-docs:
    name: Build Documentation
    # Documentation validation shares CI concurrency so a newer push cancels
    # every check for the superseded commit together.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history is required so the site can show a per-page "last updated"
      # date sourced from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"  # renovate: datasource=node-version depName=node
          cache: npm

      - name: Install documentation dependencies
        run: |
          uv sync --locked --extra docs
          npm ci

      - name: Check the generated API reference is current
        run: uv run --no-sync python scripts/generate_api_docs.py --check

      - name: Check documentation frontmatter
        run: uv run --no-sync python scripts/check_docs_frontmatter.py

      - name: Build documentation
        run: npm run docs:build

      - name: Validate documentation structure
        run: |
          if [ ! -d "site" ] || [ ! -f "site/index.html" ]; then
            echo "Error: Documentation build failed - site/index.html not found"
            exit 1
          fi

      - name: Verify every page was rendered
        run: uv run --no-sync python scripts/check_docs_coverage.py

      - name: Verify internal links, anchors, and assets
        run: uv run --no-sync python scripts/check_docs_links.py

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run search, brand, and accessibility suite
        run: npm run docs:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload documentation artifact
        # Only retain on main — PR runs validate correctness but don't need the artifact.
        # This is the Pages-format artifact the deploy-docs job publishes.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/
          retention-days: 30

  demo-image:
    name: Build Demo Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722  # 17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: micboard_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Build the read-only demo image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: django-micboard-demo:ci

      # The whole deployment path, not just the build: the app's own micboard.E001
      # check rejects SQLite when DEBUG is off, so a demo without Postgres cannot start.
      - name: Migrate, seed, and check against Postgres
        run: >-
          docker run --rm --network host
          -e DJANGO_SECRET_KEY=ci-only-secret-key-with-enough-length-and-variety-4Kq9zX7
          -e DJANGO_DEBUG=False
          -e DJANGO_ALLOWED_HOSTS=localhost
          -e DJANGO_BEHIND_TLS_PROXY=True
          -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/micboard_demo
          -e MICBOARD_DEMO_PASSWORD=ci-only-password
          django-micboard-demo:ci
          sh -c 'python manage.py migrate --noinput && python manage.py seed_demo_data
          && python manage.py check --deploy --fail-level ERROR'

  deploy-docs:
    name: Deploy Documentation
    needs: build-docs
    # Publish only the canonical branch; pull requests validate the build without
    # deploying. `workflow_dispatch` is accepted so the site can still be published when a
    # merge performed with GITHUB_TOKEN does not trigger the push event, as happens with
    # bot-merged release pull requests.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pages: write` publishes the built site; `id-token: write` lets deploy-pages mint the
    # OIDC token Pages requires. Both are scoped to this job, which runs no repository code.
    permissions:
      pages: write
      id-token: write
    # Pages refuses concurrent deployments, so this job opts out of the workflow-wide
    # cancel-in-progress group rather than leaving a deployment half-applied.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: true
          show-patched-versions: true

  scorecard:
    name: Scorecard supply-chain security
    # Scorecard grades a repository, not a change: on a pull request it would score the
    # merge ref and upload SARIF for a branch nobody ships.
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          sarif_file: results.sarif

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - lint
      - package
      - test
      - security
      - codeql
      - build-docs
      - demo-image
      - dependency-review
      - scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'to_entries | all(.value.result == "success" or (.key == "dependency-review" and .value.result == "skipped") or (.key == "scorecard" and .value.result == "skipped"))' <<<"$REQUIRED_JOB_RESULTS" > /dev/null; then
            echo "All required CI jobs succeeded."
            exit 0
          fi

          jq -r '
            to_entries[]
            | select(.value.result != "success" and (.key != "dependency-review" or .value.result != "skipped") and (.key != "scorecard" or .value.result != "skipped"))
            | "::error title=Required CI job did not succeed::\(.key): \(.value.result)"
          ' <<<"$REQUIRED_JOB_RESULTS"
          exit 1
