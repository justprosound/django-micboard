---
name: CI Quality Gates
run-name: "CI · ${{ github.head_ref || github.ref_name }}"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run prek
        run: uv run --no-sync prek run --all-files --show-diff-on-failure

      - name: Type check with mypy
        run: uv run --no-sync python -m mypy micboard

      - name: Check migration drift
        run: >-
          uv run --no-sync python manage.py makemigrations
          --check --dry-run --settings=tests.settings

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          enable-cache: "false"

      - name: Build wheel
        run: |
          uv build --no-sources --sdist --clear
          uv build --no-sources --wheel dist/*.tar.gz

      - name: Validate reusable-app contents
        run: uv run --no-project python scripts/validate_wheel.py dist/*.whl

      - name: Smoke-test installed wheel
        run: uv run --no-project --with dist/*.whl python scripts/smoke_test_installed_wheel.py

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"  # renovate: datasource=endoflife-date depName=python
          - "3.14"  # renovate: datasource=endoflife-date depName=python
        django-version:
          - "5.2"  # Supported Django LTS floor
          - "6.0"  # renovate: datasource=endoflife-date depName=django
          - "6.1"  # Latest stable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests with coverage
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: |
          uv run --no-sync --with "Django~=${DJANGO_VERSION}.0" pytest tests/ \
            -n auto \
            --cov=micboard \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=95 \
            --junitxml=junit.xml \
            -v
          uv run --no-sync python scripts/check_coverage_inventory.py

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report-py${{ matrix.python-version }}-dj${{ matrix.django-version }}
          path: |
            coverage.xml
            htmlcov/
          # Keep 30 days on main for post-release review; 7 days is enough for PR iteration
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          DJANGO_VERSION: ${{ matrix.django-version }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          env_vars: PYTHON_VERSION,DJANGO_VERSION

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results


  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          # uv audit and bandit scan source only; no dep install needed
          enable-cache: "false"

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command

      - name: Run Bandit security check
        # bandit scans source AST — no package install required
        run: uvx bandit -r micboard -ll

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: none

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.12.16"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          category: "/language:python"

  build-docs:
    name: Build Documentation
    # Documentation validation shares CI concurrency so a newer push cancels
    # every check for the superseded commit together.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history is required so the site can show a per-page "last updated"
      # date sourced from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"  # renovate: datasource=node-version depName=node
          cache: npm

      - name: Install documentation dependencies
        run: |
          uv sync --locked --extra docs
          npm ci

      - name: Check the generated API reference is current
        run: uv run --no-sync python scripts/generate_api_docs.py --check

      - name: Check documentation frontmatter
        run: uv run --no-sync python scripts/check_docs_frontmatter.py

      - name: Build documentation
        run: npm run docs:build

      - name: Validate documentation structure
        run: |
          if [ ! -d "site" ] || [ ! -f "site/index.html" ]; then
            echo "Error: Documentation build failed - site/index.html not found"
            exit 1
          fi

      - name: Verify every page was rendered
        run: uv run --no-sync python scripts/check_docs_coverage.py

      - name: Verify internal links, anchors, and assets
        run: uv run --no-sync python scripts/check_docs_links.py

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run search, brand, and accessibility suite
        run: npm run docs:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload documentation artifact
        # Only retain on main — PR runs validate correctness but don't need the artifact.
        # This is the Pages-format artifact the deploy-docs job publishes.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/
          retention-days: 30

  deploy-docs:
    name: Deploy Documentation
    needs: build-docs
    # Publish only the canonical branch; pull requests validate the build without
    # deploying. `workflow_dispatch` is accepted so the site can still be published when a
    # merge performed with GITHUB_TOKEN does not trigger the push event, as happens with
    # bot-merged release pull requests.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pages: write` publishes the built site; `id-token: write` lets deploy-pages mint the
    # OIDC token Pages requires. Both are scoped to this job, which runs no repository code.
    permissions:
      pages: write
      id-token: write
    # Pages refuses concurrent deployments, so this job opts out of the workflow-wide
    # cancel-in-progress group rather than leaving a deployment half-applied.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: true
          show-patched-versions: true

  scorecard:
    name: Scorecard supply-chain security
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          sarif_file: results.sarif

  mutation-testing:
    name: Mutation testing with mutmut
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run mutation tests
        run: |
          uv run --no-sync mutmut run --no-progress || echo "MUTMUT_EXIT=$?" >> "$GITHUB_ENV"

      - name: Report mutation results
        if: always()
        run: |
          echo "## Mutation Testing Results" >> "$GITHUB_STEP_SUMMARY"
          uv run --no-sync mutmut results >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          SURVIVED=$(uv run --no-sync mutmut results 2>/dev/null | grep -i -c "^survived" || true)
          echo "**Surviving mutants:** $SURVIVED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Surviving mutants indicate logic that tests don't verify._" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mutmut-cache-${{ github.run_id }}
          path: .mutmut-cache
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - lint
      - package
      - test
      - security
      - codeql
      - build-docs
      - dependency-review
      - scorecard
      - mutation-testing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'to_entries | all(.value.result == "success" or (.key == "dependency-review" and .value.result == "skipped") or (.key == "mutation-testing" and .value.result == "skipped") or (.key == "scorecard" and .value.result == "skipped"))' <<<"$REQUIRED_JOB_RESULTS" > /dev/null; then
            echo "All required CI jobs succeeded."
            exit 0
          fi

          jq -r '
            to_entries[]
            | select(.value.result != "success" and (.key != "dependency-review" or .value.result != "skipped") and (.key != "mutation-testing" or .value.result != "skipped") and (.key != "scorecard" or .value.result != "skipped"))
            | "::error title=Required CI job did not succeed::\(.key): \(.value.result)"
          ' <<<"$REQUIRED_JOB_RESULTS"
          exit 1
