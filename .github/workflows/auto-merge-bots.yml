---
name: Auto-merge Bot PRs
run-name: "Auto-merge bot PR · #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.actor == 'renovate[bot]' ||
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python

      - name: Sync docs requirements if lockfile drifted
        run: |
          uv export --locked --no-dev --extra docs --no-emit-project --output-file docs/requirements.txt
          if ! git diff --quiet docs/requirements.txt; then
            echo "docs/requirements.txt drifted from uv.lock; updating..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/requirements.txt
            git commit -m "chore(docs): sync docs/requirements.txt with locked dependencies"
            git push origin ${{ github.event.pull_request.head.ref }}
          else
            echo "docs/requirements.txt is already in sync."
          fi

      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash
