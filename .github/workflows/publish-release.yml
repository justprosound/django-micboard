---
name: Publish Release
run-name: "Publish release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Merge commit selected by the protected release workflow"
        required: true
      version:
        description: "CalVer version already merged to main (YY.MM.DD[.N])"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
      sha: ${{ steps.release.outputs.sha }}
      source-date-epoch: ${{ steps.release.outputs.source-date-epoch }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}

      - name: Validate merged release metadata
        id: release
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release commit: $EXPECTED_SHA"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Checked-out commit does not match the selected release merge"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "Selected release merge is not part of protected main"
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]{2,4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$ ]]; then
            echo "Invalid CalVer format: $RELEASE_VERSION"
            exit 1
          fi
          grep -Fqx "version = \"$RELEASE_VERSION\"" pyproject.toml
          grep -q "^## \[$RELEASE_VERSION\]" CHANGELOG.md
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source-date-epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Read release changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          DELIMITER="release-changelog-$(git rev-parse HEAD)"
          {
            echo "content<<$DELIMITER"
            awk -v heading="## [$RELEASE_VERSION]" '
              index($0, heading) == 1 { in_release = 1; next }
              in_release && /^## \[/ { exit }
              in_release { print }
            ' CHANGELOG.md
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  build-release:
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate-release.outputs.source-date-epoch }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python

      - name: Build distribution
        run: |
          uv build --no-sources --sdist --clear
          uv run --no-project python scripts/normalize_sdist.py dist/*.tar.gz
          uv build --no-sources --wheel dist/*.tar.gz

      - name: Check distribution
        run: |
          uv run --no-project python scripts/validate_wheel.py dist/*.whl
          uv run --no-project --with dist/*.whl python scripts/smoke_test_installed_wheel.py

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/django-micboard-${{ needs.validate-release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Seal distribution checksums
        run: |
          jq --null-input \
            --arg sha "$RELEASE_SHA" \
            --arg version "$RELEASE_VERSION" \
            '{sha: $sha, version: $version}' \
            > dist/RELEASE-METADATA.json
          cd dist
          sha256sum ./*.whl ./*.tar.gz ./*.spdx.json RELEASE-METADATA.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload sealed distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distribution-${{ needs.validate-release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  attest-release:
    needs: [validate-release, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Download sealed distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distribution-${{ needs.validate-release.outputs.version }}
          path: dist

      - name: Verify distribution checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/RELEASE-METADATA.json

      - name: Attest distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/django-micboard-${{ needs.validate-release.outputs.version }}.spdx.json

  publish-testpypi:
    needs: [validate-release, build-release, attest-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-micboard/${{ needs.validate-release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          enable-cache: "false"

      - name: Download sealed distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distribution-${{ needs.validate-release.outputs.version }}
          path: dist

      - name: Verify distribution checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Create TestPyPI publish attestations
        run: |
          uvx pypi-attestations sign dist/*.whl dist/*.tar.gz
          test "$(find dist -maxdepth 1 -name '*.publish.attestation' | wc -l)" -eq 2

      - name: Check if version already exists on TestPyPI
        id: testpypi-check
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          if curl --fail --silent --show-error \
            "https://test.pypi.org/pypi/django-micboard/$RELEASE_VERSION/json" \
            > /dev/null 2>&1; then
            echo "Version $RELEASE_VERSION already exists on TestPyPI — skipping upload"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to TestPyPI
        if: steps.testpypi-check.outputs.exists != 'true'
        run: >-
          uv publish --trusted-publishing always --no-config
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*.whl dist/*.tar.gz

      - name: Upload TestPyPI-signed distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: testpypi-distribution-${{ needs.validate-release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  verify-testpypi:
    needs: [validate-release, build-release, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download sealed distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distribution-${{ needs.validate-release.outputs.version }}
          path: dist

      - name: Verify TestPyPI distribution digests
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/testpypi-release.json" \
              "https://test.pypi.org/pypi/django-micboard/$RELEASE_VERSION/json"; then
              MATCHED=true
              while read -r expected filename; do
                filename="${filename#./}"
                actual="$(jq \
                  --arg filename "$filename" \
                  --raw-output \
                  '.urls[] | select(.filename == $filename) | .digests.sha256' \
                  "$RUNNER_TEMP/testpypi-release.json")"
                if [ "$actual" != "$expected" ]; then
                  echo "TestPyPI digest mismatch for $filename"
                  MATCHED=false
                fi
              done < <(grep -E '\.(whl|tar\.gz)$' dist/SHA256SUMS)
              if [ "$MATCHED" = true ]; then
                exit 0
              fi
            fi
            echo "Waiting for TestPyPI release metadata (attempt $attempt/30)"
            sleep 5
          done
          echo "TestPyPI did not expose the sealed release files"
          exit 1

  publish-pypi:
    needs: [validate-release, build-release, attest-release, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi-release
      url: https://pypi.org/p/django-micboard/${{ needs.validate-release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Set up uv and Python
        uses: ./.github/actions/setup-uv-python
        with:
          enable-cache: "false"

      - name: Download sealed distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distribution-${{ needs.validate-release.outputs.version }}
          path: dist

      - name: Verify distribution checksums
        run: cd dist && sha256sum --check SHA256SUMS

      - name: Create PyPI publish attestations
        run: |
          uvx pypi-attestations sign dist/*.whl dist/*.tar.gz
          test "$(find dist -maxdepth 1 -name '*.publish.attestation' | wc -l)" -eq 2

      - name: Publish to PyPI
        run: >-
          uv publish --trusted-publishing always --no-config
          --check-url https://pypi.org/simple/
          dist/*.whl dist/*.tar.gz

      - name: Upload PyPI-signed distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi-distribution-${{ needs.validate-release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

  create-github-release:
    needs:
      - validate-release
      - build-release
      - attest-release
      - publish-testpypi
      - verify-testpypi
      - publish-pypi
    if: >-
      always() &&
      needs.validate-release.result == 'success' &&
      needs.build-release.result == 'success' &&
      needs.attest-release.result == 'success' &&
      needs.publish-testpypi.result == 'success' &&
      needs.verify-testpypi.result == 'success' &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download PyPI release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-distribution-${{ needs.validate-release.outputs.version }}
          path: dist

      - name: Verify release assets
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.publish.attestation' | wc -l)" -eq 2

      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
          RELEASE_TAG: v${{ needs.validate-release.outputs.version }}
        run: |
          resolve_tag_sha() {
            local ref_json="$1"
            local obj_type obj_sha
            obj_type="$(jq -r '.object.type' <<< "$ref_json")"
            obj_sha="$(jq -r '.object.sha' <<< "$ref_json")"
            if [ "$obj_type" = "commit" ]; then
              echo "$obj_sha"
            elif [ "$obj_type" = "tag" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.object.sha'
            else
              echo "Unexpected tag object type: $obj_type" >&2
              return 1
            fi
          }

          if REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
            ACTUAL_SHA="$(resolve_tag_sha "$REF_JSON")"
            if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to $ACTUAL_SHA, expected $RELEASE_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$RELEASE_TAG" \
              --field sha="$RELEASE_SHA" >/dev/null
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0  # v3.0.2
        with:
          tag_name: v${{ needs.validate-release.outputs.version }}
          target_commitish: ${{ needs.validate-release.outputs.sha }}
          name: Release ${{ needs.validate-release.outputs.version }}
          body: ${{ needs.validate-release.outputs.changelog }}
          draft: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json
            dist/*.publish.attestation
            dist/SHA256SUMS
            dist/RELEASE-METADATA.json
          overwrite_files: true
